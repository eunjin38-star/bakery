height:520px){.panel{max-height:96vh;padding:14px}.panel h2{font-size:23px;margin-bottom:8px}.paper{padding:12px;font-size:15px;line-height:1.45}.dialogue{min-height:58px;padding:9px 13px;font-size:15px}.hudRight{min-height:42px}.hudRight .timerText{font-size:19px}.hintToggle{font-size:14px}.successHero img{max-height:61vh}.ok{margin-top:9px;padding:8px 15px}}@media(orientation:portrait) and (max-width:800px){#game:before{content:"가로 화면으로 돌리면 단서 위치를 더 정확히 누를 수 있어요.";position:absolute;z-index:2;left:50%;top:8px;transform:translateX(-50%);width:max-content;max-width:92vw;padding:7px 12px;border-radius:999px;background:#2b180fdd;color:#fff;font-size:12px;text-align:center}.stage{width:100vw;max-height:none}.entryBox{width:92vw;padding:22px 20px}.entryBox h1{font-size:clamp(25px,8vw,40px)}.fields{grid-template-columns:1fr}.modal{padding:7px}.panel,.panel.framePanel{width:97vw;max-height:94vh;padding:15px}.phoneChallenge{grid-template-columns:1fr}.memoZoomWrap{display:none}.eggPuzzleLayout,.ryePuzzleLayout{grid-template-columns:1fr}.eggTray{width:min(390px,88vw)}.dialogue{width:94%;font-size:14px;padding:9px}.speaker{padding:5px 8px}.hudRight{transform:scale(.72);transform-origin:top right}.inventoryItems{transform:scale(.8);transform-origin:top left}}

<body>
<section id="prologue" class="screen active"><video id="proVideo" class="proVideo" preload="auto" poster="bakery-door-closed.webp" muted playsinline webkit-playsinline autoplay><source src="prologue.mp4" type="video/mp4"></video><div class="proShade"></div><div id="proText" class="proText">며칠 전, 할아버지가 갑자기 쓰러지셨다.</div><button id="proFallback" class="proFallback" hidden>제과점 들어가기</button><button id="skipPro" class="skip">건너뛰기</button></section>
<section id="entry" class="screen"><div class="entryBox"><h1>할아버지의 시크릿 레시피</h1><p>할아버지가 남긴 단서를 따라 시그니처 빵의 레시피를 찾아보세요.</p><div class="fields"><input id="studentNo" inputmode="numeric" placeholder="학번"><input id="studentName" placeholder="이름"></div><button id="startBtn" class="start">제과점 문 열기</button></div></section>
<section id="game" class="screen"><div id="stage" class="stage"><img id="sceneImg" class="sceneImg" alt="제과점"><div id="spots"></div><div class="hudRight"><div id="hintLog" class="hintLog"><button class="hintToggle" type="button">💡 힌트</button></div><div id="timer" class="timerText">20:00</div></div><div id="inventory" class="inventoryItems"></div><button id="backBtn" class="backBtn" hidden>← 돌아가기</button><div id="dialogue" class="dialogue hidden" role="button" tabindex="0"><b id="speaker" class="speaker">나</b><span id="line"></span><button id="dialogueOk">다음 ▾</button></div></div></section>
<div id="modal" class="modal"><div id="panel" class="panel"><button id="modalClose" class="close">×</button><div id="modalBody"></div></div></div>
<div class="orient">태블릿을 가로로 돌려 주세요.</div>
<div class="creatorMark" aria-label="제작자">by. jjin_T</div>
<script>
const $=s=>document.querySelector(s);
const state={name:'학생',scene:'main',key:false,doorChecked:false,doorOpen:false,phone:false,memoRead:false,phoneUnlocked:false,phonePhotoViewed:false,phoneNoteViewed:false,phoneOrderNoteViewed:false,recipeBook:false,honeyTongue:'',honeyLips:'',signatureIngredients:[],signatureNote:false,goldenEgg:false,fridgeNote:false,fridgeIngredient:false,ryeNote:false,ryeFlour:false,ryeSequence:[],ovenPreheated:false,ovenCode:[],mixStep:0,breadComplete:false,kitchenIntroShown:false,kitchenSearched:[],phoneQuest:false,time:1200,timerId:null,introShown:false,dialoguePages:[],dialogueIndex:0,items:[],inventoryPage:0};
const AS={
  "close": "bakery-door-closed.webp",
  "open": "bakery-door-open.webp",
  "counter": "counter-main.webp",
  "drawer": "counter-drawer-phone.webp",
  "drawerEmpty": "counter-drawer-empty.webp",
  "kitchen": "kitchen-main.webp",
  "phonePhoto": "phone-photo-hint.webp",
  "fridgeInterior": "fridge-interior.webp",
  "ryeBin": "rye-flour-bin.webp",
  "lockedRecipeBook": "locked-recipe-book.webp",
  "lockedHoneyJar": "locked-honey-jar.webp",
  "ovenPanel": "oven-preheat-panel.webp",
  "signatureBread": "signature-bread-success.webp",
  "endingCrowd": "bakery-ending-crowd.webp"
};
$('#entry').style.backgroundImage=`url("${AS.close}")`;
function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}
function showEntry(){const v=$('#proVideo');v.pause();showScreen('entry')}
function prologuePlaybackFailed(){let v=$('#proVideo');if(!$('#prologue').classList.contains('active'))return;v.style.display='none';$('#proText').textContent='프롤로그 영상을 불러오지 못했습니다. 아래 버튼을 눌러 제과점으로 들어가세요.';$('#proFallback').hidden=false;setTimeout(()=>{if($('#prologue').classList.contains('active'))showEntry()},1800)}
const proLines=[[0,'며칠 전, 할아버지가 갑자기 쓰러지셨다.'],[3,'나는 갑작스럽게 할아버지 대신 제과점을 맡게 되었다.'],[6,'하지만 손님들이 찾는 시그니처 빵의 레시피는 어디에도 보이지 않았다.']];
$('#proVideo').ontimeupdate=()=>{let t=$('#proVideo').currentTime,line=proLines[0][1];proLines.forEach(x=>{if(t>=x[0])line=x[1]});$('#proText').textContent=line};$('#proVideo').onended=showEntry;$('#proVideo').onerror=prologuePlaybackFailed;$('#skipPro').onclick=showEntry;$('#proFallback').onclick=showEntry;setTimeout(()=>{let v=$('#proVideo');if($('#prologue').classList.contains('active')&&(v.error||v.readyState<2||v.paused))prologuePlaybackFailed()},3000);
$('#startBtn').onclick=()=>{state.name=$('#studentName').value.trim()||'학생';showScreen('game');goMain();startTimer();if(!state.introShown){state.introShown=true;showDialoguePages([`할아버지의 <span class="clue">‘시크릿 레시피’</span>를 찾아보자.`,'뭐부터 살펴봐야 할까.',`일단 <span class="clue">‘주방’</span>에 들어가 볼까?`])}};
function startTimer(){if(state.timerId)return;state.timerId=setInterval(()=>{if(state.time>0)state.time--;let m=String(Math.floor(state.time/60)).padStart(2,'0'),s=String(state.time%60).padStart(2,'0');$('#timer').textContent=m+':'+s},1000)}
function stopTimer(){if(state.timerId){clearInterval(state.timerId);state.timerId=null}$('#timer').title='빵 완성! 시간이 멈췄습니다.'}
function setScene(src,wide=false){$('#sceneImg').src=src;$('#stage').className='stage'+(wide?' wide':'');$('#spots').innerHTML='';$('#backBtn').hidden=true;renderInventory();renderHintLog()}
function spot(label,x,y,w,h,fn){let b=document.createElement('button');b.className='spot';Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});b.innerHTML=`<span class="spotLabel">${label}</span>`;b.setAttribute('aria-label',label);b.onclick=fn;$('#spots').appendChild(b);return b}
function goMain(){state.scene='main';setScene(state.doorOpen?AS.open:AS.close,false);spot('칠판',4.4,16.5,18.3,30.5,inspectBoard);spot('빵 액자',52.2,5.5,16.7,31,inspectFrame);spot('벽 메모',45.2,26.2,7.2,13.2,showMemo);spot('주방 문',24.5,14,19,43,useDoor);spot('카운터',43,39,32,34,goCounter);spot('힌트',0.7,87.5,7.2,11,toggleHints);spot('메뉴',93.7,0.7,6.2,10,showMenu)}
function goCounter(){if(!state.phoneQuest){showDialogue('계산대와 서랍이 있는 카운터이다.');return}state.scene='counter';setScene(AS.counter,true);spot('가운데 서랍',35.5,43,29.5,14,openDrawer);$('#backBtn').hidden=false}
function openDrawer(){state.scene='drawer';setScene(state.phone?AS.drawerEmpty:AS.drawer,true);if(!state.phone)spot('휴대폰',42,27,16,34,takePhone);$('#backBtn').hidden=false}
function enterKitchen(){state.scene='kitchen';setScene(AS.kitchen,false);spot('오븐',17.5,6,15.5,43,inspectOven);spot('재료 선반',32.5,0,28.5,34,inspectIngredientShelf);spot('냉장고',91.2,12,8.8,70,inspectFridge);spot('조리대',21,45,61,48,inspectWorktop);spot('개수대',61.5,29.5,22,22,()=>inspectKitchenSpot('sink','개수대 근처에 있나? 책은 물에 젖잖아.'));spot('계란판',53.5,34,8.5,10.5,inspectEggTray);spot('밀가루통 아래',10.5,47,10.5,29,inspectFlourBag);spot('조리대 아래 호밀가루통',43,73,14,19,inspectRyeContainer);$('#backBtn').hidden=false;if(!state.kitchenIntroShown){state.kitchenIntroShown=true;showDialogue('주방에 들어왔다. 이제 레시피가 숨겨진 곳을 찾아보자.')}}
function inspectKitchenSpot(id,line){if(!state.kitchenSearched.includes(id))state.kitchenSearched.push(id);showDialogue(line)}
function inspectIngredientShelf(){if(!state.recipeBook){inspectKitchenSpot('shelf','재료가 있는 선반이네. 아직은 평범한 재료들만 보인다.');return}showIngredientShelf()}
function inspectFlourBag(){if(!state.phonePhotoViewed){inspectKitchenSpot('flourBag','밀가루 포대자루가 놓여있어.');return}if(state.recipeBook){showDialogue('밀가루통 아래에서 찾은 레시피북은 이미 챙겼다.');return}showLockedRecipeBook()}
function showLockedRecipeBook(){showModal(`<h2>잠긴 레시피북</h2><div class="objectPuzzle"><div class="objectPuzzleImage"><img src="${AS.lockedRecipeBook}" alt="황동 잠금끈이 채워진 갈색 레시피북"></div><div class="paper"><p>사진 속 위치에서 레시피북을 찾았다.<br>하지만 표지의 잠금끈이 열리지 않는다.</p><p><b>‘밀가루통’에 쓰인 자음 중 <span class="clue">여린입천장소리</span>를 음절 순서대로 모두 쓰시오.</b></p><div class="answerRow"><input id="recipeLockAnswer" type="text" inputmode="text" placeholder="자음 입력" autocomplete="off"><button onclick="checkRecipeBookLock()">잠금 풀기</button></div><div id="recipeLockMsg" class="answerMsg"></div></div></div>`,true);setTimeout(()=>$('#recipeLockAnswer')?.focus(),0)}
function checkRecipeBookLock(){let answer=$('#recipeLockAnswer').value.replace(/[\s,·\/]/g,'');if(answer==='ㄱㅇ'){state.recipeBook=true;addItem('recipeBook');showModal('<h2>레시피북 잠금 해제!</h2><div class="acquire"><span class="bigIcon">📕</span>‘밀가루통’의 여린입천장소리는 <b>ㄱ, ㅇ</b>이다.<br>황동 잠금끈이 풀렸다.<br>레시피북을 인벤토리에 담았다.</div><button class="ok" onclick="showRecipeBook()">레시피북 열기</button>')}else{let msg=$('#recipeLockMsg');msg.style.color='#a22f25';msg.textContent='각 자음이 발음되는 위치를 다시 확인해 보자.'}}
$('#backBtn').onclick=()=>{if(state.scene==='drawer'){goCounter();return}if(state.scene==='kitchen'){let firstExit=!state.phoneQuest;state.phoneQuest=true;goMain();if(firstExit)showDialoguePages([`할아버지는 <span class="clue">‘휴대폰’</span>을 놓고 다니셨지.`,`밖으로 나왔으니 <span class="clue">‘카운터’</span>에서 휴대폰을 찾아보자.`]);return}goMain()};
function showDialogue(text){showDialoguePages([text])}
function showDialoguePages(pages){state.dialoguePages=pages;state.dialogueIndex=0;$('#speaker').textContent=state.name;$('#dialogue').classList.remove('hidden');$('#stage').classList.add('dialogueOpen');renderDialoguePage()}
function syncBackButton(){let d=$('#dialogue');if(!d.classList.contains('hidden'))$('#stage').style.setProperty('--dialogue-clearance',d.offsetHeight+20+'px')}
function renderDialoguePage(){if(state.dialogueIndex>=state.dialoguePages.length){$('#dialogue').classList.add('hidden');$('#stage').classList.remove('dialogueOpen');$('#stage').style.removeProperty('--dialogue-clearance');return}$('#line').innerHTML=state.dialoguePages[state.dialogueIndex];$('#dialogueOk').textContent=state.dialogueIndex===state.dialoguePages.length-1?'닫기':'다음 ▾';requestAnimationFrame(syncBackButton)}
function advanceDialogue(){state.dialogueIndex++;renderDialoguePage()}
$('#dialogue').onclick=advanceDialogue;$('#dialogue').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advanceDialogue()}};
function prepareTouchInputs(root=document){root.querySelectorAll('input').forEach(input=>{input.setAttribute('handwriting','true');input.setAttribute('enterkeyhint','done');input.setAttribute('autocorrect','off');input.setAttribute('spellcheck','false');input.addEventListener('pointerup',()=>input.focus(),{passive:true})})}
function showModal(html,wide=false){$('#modalBody').innerHTML=html;$('#panel').classList.toggle('framePanel',wide);$('#modal').classList.add('open');prepareTouchInputs($('#modalBody'))}function closeModal(){$('#modal').classList.remove('open');$('#panel').classList.remove('framePanel');$('#modalClose').hidden=false}$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal')&&!$('#modalClose').hidden)closeModal()};prepareTouchInputs(document);
function inspectBoard(){if(state.key){showDialogue('칠판 뒤는 이미 살펴봤다.');return}if(!state.doorChecked){showDialogue('할아버지가 적어 두신 칠판이다. 지금은 특별한 점이 보이지 않는다.');return}showModal(`<h2>칠판의 문제</h2><div class="paper"><b>칠판에 적힌 <span class="clue">‘좋은 빵은 좋은 마음에서’</span>라는 문장에서 음운은 모두 몇 개인가.</b><div class="answerRow"><input id="phonemeAnswer" type="number" inputmode="numeric" placeholder="숫자 입력" aria-label="음운 개수"><button onclick="checkPhonemeAnswer()">정답 확인</button></div><div id="answerMsg" class="answerMsg"></div></div>`);setTimeout(()=>$('#phonemeAnswer')?.focus(),0)}
function checkPhonemeAnswer(){let input=$('#phonemeAnswer'),msg=$('#answerMsg');if(input.value.trim()==='22'){state.key=true;addItem('key');showModal('<h2>주방 열쇠 발견</h2><div class="acquire"><span class="bigIcon">🗝️</span>정답이다! 칠판을 살짝 들어 보니 뒤에 주방 열쇠가 숨겨져 있었다.<br>열쇠가 인벤토리에 담겼다.</div><button class="ok" onclick="closeModal()">확인</button>')}else{msg.style.color='#a22f25';msg.textContent='정답이 아니다. 칠판의 문장을 소리 나는 단위로 다시 세어 보자.';input.select()}}
function inspectFrame(){showDialogue('빵이 그려진 액자다. 지금은 특별한 점이 보이지 않는다.')}

function unlockDoorWithKey(){if(state.scene!=='main'||!state.key||state.doorOpen)return false;state.doorOpen=true;state.items=state.items.filter(id=>id!=='key');state.inventoryPage=0;$('#sceneImg').src=AS.open;renderInventory();showDialogue('열쇠가 맞았다! 주방 문이 열렸다. 문을 누르면 안으로 들어갈 수 있다.');return true}
function showMemo(){state.memoRead=true;showModal(`<h2>벽에 붙은 메모</h2><div class="paper"><div style="text-align:center;font-size:25px;font-weight:900;margin-bottom:12px">오늘도 맛있는 하루!</div>휴대폰의 12개 점은 아래 <b>단모음 체계표</b>의 자리와 같다.<br><b>메모에서 단모음을 찾되, 같은 모음은 한 번만 남기고 처음 나온 순서대로 점을 누르자.</b><div class="vowels"><span>ㅣ</span><span>ㅟ</span><span>ㅡ</span><span>ㅜ</span><span>ㅔ</span><span>ㅚ</span><span>ㅓ</span><span>ㅗ</span><span>ㅐ</span><span>·</span><span>ㅏ</span><span>·</span></div><small>위에서부터 고모음·중모음·저모음, 왼쪽부터 전설 평순·전설 원순·후설 평순·후설 원순의 자리다.</small></div>`)}
function takePhone(){if(!state.phone){state.phone=true;addItem('phone');setScene(AS.drawerEmpty,true);state.scene='drawer';$('#backBtn').hidden=false;showModal('<h2>휴대폰 획득</h2><div class="acquire"><span class="bigIcon">📱</span>할아버지의 휴대폰을 찾았다.<br>휴대폰이 인벤토리에 담겼다.</div><button class="ok" onclick="closeModal()">확인</button>')}else showDialogue('휴대폰은 이미 챙겼다.')}
const itemInfo={key:{icon:'🗝️',name:'주방 열쇠',open:()=>showModal('<h2>주방 열쇠</h2><div class="acquire"><span class="bigIcon">🗝️</span>칠판 뒤에서 찾은 열쇠다.</div>')},phone:{icon:'📱',name:'할아버지의 휴대폰',open:openPhone},recipeBook:{icon:'📕',name:'할아버지의 레시피북',open:showRecipeBook},honey:{icon:'🍯',name:'꿀',open:()=>showModal('<h2>획득한 재료</h2><div class="acquire"><span class="bigIcon">🍯</span>레시피북에는 적혀 있지 않았던 시그니처 재료, 꿀이다.</div>')},cinnamon:{icon:'🪵',name:'시나몬',open:()=>showModal('<h2>획득한 재료</h2><div class="acquire"><span class="bigIcon">🪵</span>레시피북에는 적혀 있지 않았던 시그니처 재료, 시나몬이다.</div>')},goldenEgg:{icon:'🥚',name:'황금계란',open:()=>showModal('<h2>획득한 재료</h2><div class="acquire"><span class="bigIcon" style="filter:sepia(1) saturate(5)">🥚</span>계란판에서 찾아낸 시그니처 재료, 황금계란이다.</div>')},soyMilk:{icon:'🥛',name:'냉장고에서 찾은 두유',open:()=>showModal('<h2>획득한 재료</h2><div class="acquire"><span class="bigIcon">🥛</span>잇몸소리 ㄷ으로 시작하는 재료, 두유다.</div>')},ryeFlour:{icon:'🥣',name:'호밀가루 1컵',open:()=>showModal('<h2>획득한 재료</h2><div class="acquire"><span class="bigIcon">🥣</span>모음의 혀 높이 암호를 풀어 얻은 호밀가루 1컵이다.</div>')}};

function showRecipeBook(page=0){page=Math.max(0,Math.min(recipePages.length-1,page));let r=recipePages[page],dots=recipePages.map((_,i)=>i===page?'●':'○').join('');showModal(`<h2>할아버지의 레시피북</h2><div class="recipeBook"><section class="recipePage"><div class="recipePageNo">${page+1} / ${recipePages.length}</div><h3>${r.name}</h3><div class="recipeSection"><b>재료</b>${r.ingredients}</div><div class="recipeSection"><b>만드는 방법</b><ol class="recipeSteps">${r.steps.map(step=>`<li>${step}</li>`).join('')}</ol></div></section><div class="recipeNav"><button onclick="showRecipeBook(${page-1})" ${page===0?'disabled':''}>◀ 이전 쪽</button><span class="recipeDots">${dots}</span><button onclick="showRecipeBook(${page+1})" ${page===recipePages.length-1?'disabled':''}>다음 쪽 ▶</button></div></div><div style="margin-top:14px;text-align:center"><button class="ok" onclick="closeModal()">레시피북 닫기</button></div>`,true)}
const shelfIngredients=['밀가루','설탕','버터','꿀','우유','달걀','이스트','소금','단팥','시나몬','물','딸기'];
const signatureIngredientIds={꿀:'honey',시나몬:'cinnamon'};
function showIngredientShelf(){let jars=shelfIngredients.map(name=>{let id=signatureIngredientIds[name],got=id&&state.signatureIngredients.includes(id);return `<button class="ingredientJar${got?' acquired':''}" onclick="selectShelfIngredient('${name}')" ${got?'disabled':''}><span class="jarLabel">${name}</span></button>`}).join('');let note=state.signatureIngredients.includes('cinnamon')?`<button class="shelfNote" onclick="showSignatureNote()">시나몬 그릇 아래에서<br>삐져나온 메모</button>`:'';showModal(`<h2>주방의 재료 선반</h2><div class="ingredientShelf"><p class="shelfGuide">레시피북의 재료와 비교해 보자. 모든 재료통을 눌러 볼 수 있다.</p><div class="shelfRows">${jars}${note}</div><div id="shelfMsg" class="shelfMsg">${note?'시나몬 그릇 아래에 종이 한 장이 보인다.':'어떤 재료가 시그니처 빵에만 들어갈까?'}</div></div>`,true)}
function selectShelfIngredient(name){let id=signatureIngredientIds[name],msg=$('#shelfMsg');if(!id){msg.className='shelfMsg';msg.textContent=`${name}은 레시피북에 적혀 있는 재료다.`;return}if(state.signatureIngredients.includes(id)){msg.textContent=`${name}은 이미 챙겼다.`;return}if(id==='honey'){state.honeyTongue='';state.honeyLips='';showHoneyJarPuzzle();return}acquireSignatureIngredient(name,id)}
function acquireSignatureIngredient(name,id){if(!state.signatureIngredients.includes(id)){state.signatureIngredients.push(id);addItem(id)}showIngredientShelf();let msg=$('#shelfMsg');if(state.signatureIngredients.includes('honey')&&state.signatureIngredients.includes('cinnamon')){msg.className='shelfMsg shelfDone';msg.textContent='레시피북에 없던 꿀과 시나몬을 찾았다. 주방에 다른 단서가 없는지 살펴보자.'}else{msg.className='shelfMsg shelfDone';msg.textContent=`레시피북에 없던 ${name}을 발견했다! 인벤토리에 담았다.`}}
function showHoneyJarPuzzle(message=''){showModal(`<h2>봉인된 꿀단지</h2><div class="objectPuzzle"><div class="objectPuzzleImage"><img src="${AS.lockedHoneyJar}" alt="황동 잠금장치로 봉인된 꿀단지"></div><div class="paper"><p>꿀단지를 찾았지만 뚜껑에 음운 잠금장치가 걸려 있다.</p><div class="choiceGroup"><strong>1. ‘꿀’의 첫소리 ㄲ과 발음 위치가 같고, 소리의 세기만 다른 자음을 모두 쓰시오.</strong><div class="answerRow"><input id="honeyConsonants" type="text" inputmode="text" placeholder="자음 입력" autocomplete="off"></div></div><div class="choiceGroup"><strong>2. ‘꿀’의 모음 ㅜ는 혀의 앞뒤 위치에 따라?</strong><div class="choiceButtons"><button class="${state.honeyTongue==='전설'?'selected':''}" onclick="chooseHoneyVowel('tongue','전설')">전설모음</button><button class="${state.honeyTongue==='후설'?'selected':''}" onclick="chooseHoneyVowel('tongue','후설')">후설모음</button></div></div><div class="choiceGroup"><strong>3. ‘꿀’의 모음 ㅜ는 입술 모양에 따라?</strong><div class="choiceButtons"><button class="${state.honeyLips==='평순'?'selected':''}" onclick="chooseHoneyVowel('lips','평순')">평순모음</button><button class="${state.honeyLips==='원순'?'selected':''}" onclick="chooseHoneyVowel('lips','원순')">원순모음</button></div></div><button class="ok" onclick="checkHoneyJar()">꿀단지 열기</button><div id="honeyPuzzleMsg" class="answerMsg">${message}</div></div></div>`,true);setTimeout(()=>$('#honeyConsonants')?.focus(),0)}
function chooseHoneyVowel(kind,value){let typed=$('#honeyConsonants')?.value||'';if(kind==='tongue')state.honeyTongue=value;else state.honeyLips=value;showHoneyJarPuzzle();$('#honeyConsonants').value=typed}
function checkHoneyJar(){let consonants=$('#honeyConsonants').value.replace(/[\s,·\/]/g,'');if(consonants==='ㄱㅋ'&&state.honeyTongue==='후설'&&state.honeyLips==='원순'){acquireSignatureIngredient('꿀','honey');let msg=$('#shelfMsg');if(msg)msg.textContent='ㄲ은 여린입천장소리이며, ㅜ는 후설·원순모음이다. 꿀단지가 열렸다!';return}showHoneyJarPuzzle('자음의 발음 위치와 ㅜ의 혀 위치·입술 모양을 다시 확인해 보자.');setTimeout(()=>{let msg=$('#honeyPuzzleMsg');if(msg)msg.style.color='#a22f25'},0)}
function showSignatureNote(fromHint=false){let first=!state.signatureNote;state.signatureNote=true;renderHintLog();showModal(`<h2>시나몬 그릇 아래의 메모</h2><div class="tornNote">시그니처 빵 재료<br>· 꿀<br>· 시나몬<br>· 황금계란<br><span class="tornFade">· 그다음은……</span></div><p style="text-align:center">메모의 아랫부분은 누군가 찢어 간 듯하다.</p><button class="ok" onclick="closeSignatureNote(${first&&!fromHint})">메모 덮기</button>`)}
function closeSignatureNote(showLine=false){closeModal();if(showLine)showDialogue(`황금계란? <span class="clue">‘계란판’</span>은 저기 있는데….`)}
function showFridgeNote(fromHint=false){let first=!state.fridgeNote;state.fridgeNote=true;renderHintLog();showModal(`<h2>계란판 안쪽에서 찾은 쪽지</h2><div class="nextNote">냉장고 안에서 <span class="clue">잇몸소리로 시작하는 재료</span>를 찾아 계란과 섞자.</div><button class="ok" onclick="closeFridgeNote(${first&&!fromHint})">쪽지 덮기</button>`)}
function closeFridgeNote(showLine=false){closeModal();if(showLine)showDialogue(`잇몸소리로 시작하는 재료라면…. <span class="clue">‘냉장고’</span>를 살펴보자.`)}
function inspectFridge(){if(!state.fridgeNote){inspectKitchenSpot('fridge','냉장고 안에 레시피가 있을 리가.');return}if(state.fridgeIngredient){showDialogue('냉장고에서 찾은 두유는 이미 챙겼다.');return}showModal(`<h2>냉장고 안</h2><p style="text-align:center;font-weight:900">잇몸소리로 시작하는 재료를 고르자.</p><div class="fridgeScene"><img src="${AS.fridgeInterior}" alt="오렌지 주스, 초코우유, 두유, 콜라, 허브차가 놓인 냉장고 내부"><button class="fridgePick fridgeOrange" onclick="selectFridgeIngredient('오렌지 주스')"><span>오렌지 주스</span></button><button class="fridgePick fridgeChoco" onclick="selectFridgeIngredient('초코우유')"><span>초코우유</span></button><button class="fridgePick fridgeSoy" onclick="selectFridgeIngredient('두유')"><span>두유</span></button><button class="fridgePick fridgeCola" onclick="selectFridgeIngredient('콜라')"><span>콜라</span></button><button class="fridgePick fridgeTea" onclick="selectFridgeIngredient('허브차')"><span>허브차</span></button></div><div id="fridgeMsg" class="answerMsg"></div>`,true)}
function selectFridgeIngredient(name){let msg=$('#fridgeMsg');if(name!=='두유'){msg.style.color='#a22f25';msg.textContent=`${name}의 첫소리는 잇몸소리가 아니다.`;return}state.fridgeIngredient=true;addItem('soyMilk');showModal('<h2>두유 획득!</h2><div class="acquire"><span class="bigIcon">🥛</span>‘두유’의 첫소리 ㄷ은 잇몸소리다.<br>두유를 인벤토리에 담았다.<br><br>두유를 꺼내자 냉장고 선반 안쪽에서 또 다른 쪽지가 보인다.</div><button class="ok" onclick="showRyeNote()">쪽지 펼치기</button>')}
function showRyeNote(fromHint=false){let first=!state.ryeNote;state.ryeNote=true;renderHintLog();showModal(`<h2>냉장고 안쪽에서 찾은 쪽지</h2><div class="nextNote">조리대 아래에 있는 <span class="clue">호밀가루통</span>에서<br><b>호밀가루 1컵 꺼내기.</b></div><button class="ok" onclick="closeRyeNote(${first&&!fromHint})">쪽지 덮기</button>`)}
function closeRyeNote(showLine=false){closeModal();if(showLine)showDialogue(`조리대 아래에 <span class="clue">‘호밀가루통’</span>이 있었던 것 같아.`)}
function inspectRyeContainer(){if(!state.ryeNote){showDialogue('조리대 아래에 재료통이 놓여 있다. 아직 열어 볼 이유는 없다.');return}if(state.ryeFlour){showDialogue('호밀가루 1컵은 이미 챙겼다.');return}state.ryeSequence=[];showRyePuzzle()}
function showRyePuzzle(message=''){let count=state.ryeSequence.length,amount=count===0?'빈 계량컵':count<4?`${count}/4컵 담김`:'1컵 완성';showModal(`<h2>호밀가루 1컵 뜨기</h2><div class="ryePuzzleLayout"><div class="ryeVisual"><img src="${AS.ryeBin}" alt="조리대 아래에서 꺼낸 열린 나무 호밀가루통과 1컵 계량 스푼"><div class="scoopMeter">${amount}<div class="scoopBar"><div class="scoopFill" style="width:${count*25}%"></div></div></div></div><div class="paper"><p><b>‘호밀가루’에 사용된 모음</b>을 스스로 찾아, 각 모음의 혀 높이를 음절 순서대로 누르자.<br>한 번 맞힐 때마다 1/4컵씩 뜰 수 있다.</p><div class="heightGuide"><div class="heightGuideTitle">혀의 높이</div><div class="heightButtons"><button onclick="pressRyeHeight('고')">고모음</button><button onclick="pressRyeHeight('중')">중모음</button><button onclick="pressRyeHeight('저')">저모음</button></div><div class="heightAxis">위쪽일수록 혀가 높고<br>아래쪽일수록 혀가 낮다.</div></div><div id="heightProgress" class="heightProgress">선택 횟수: ${count} / 4</div><div id="ryeMsg" class="answerMsg">${message}</div><button class="ok" onclick="resetRyeSequence()">계량컵 비우기</button></div></div>`,true)}
function pressRyeHeight(height){const answer=['중','고','저','고'],i=state.ryeSequence.length;if(height!==answer[i]){showRyePuzzle('이 단계의 혀 높이와 맞지 않는다. 다른 높이를 골라 보자.');$('#ryeMsg').style.color='#a22f25';return}state.ryeSequence.push(height);if(state.ryeSequence.length<answer.length){showRyePuzzle('정확하다! 계량컵에 1/4컵을 더 담았다.');return}state.ryeFlour=true;addItem('ryeFlour');showModal('<h2>호밀가루 1컵 획득!</h2><div class="acquire"><span class="bigIcon">🥣</span>모음의 혀 높이를 음절 순서대로 정확히 눌러 계량컵을 가득 채웠다.<br>호밀가루 1컵을 인벤토리에 담았다.<br><br>재료는 모두 모였다. 반죽을 만들기 전에 <span class="clue">오븐을 예열</span>하자.</div><button class="ok" onclick="closeModal()">확인</button>')}
function resetRyeSequence(){state.ryeSequence=[];showRyePuzzle()}
function allMixIngredientsReady(){return mixOrder.every(id=>state.items.includes(id))}
function inspectOven(){if(state.ovenPreheated){showDialogue('오븐 예열이 끝났다. 이제 조리대에서 재료를 순서대로 놓자.');return}if(!allMixIngredientsReady()){inspectKitchenSpot('oven','오븐이다. 아직은 예열할 때가 아닌 것 같다. 먼저 필요한 재료를 모두 찾아보자.');return}state.ovenCode=[1,1,1,1,1];showOvenPuzzle()}
function showOvenPuzzle(message=''){const positions=[25.3,37.7,50.1,62.5,74.8];let dials=positions.map((left,i)=>`<button class="ovenDialButton" style="left:${left}%" onclick="turnOvenDial(${i})" aria-label="${i+1}번째 다이얼, 현재 ${state.ovenCode[i]}단계">${state.ovenCode[i]}</button>`).join('');showModal(`<h2>오븐 예열 장치</h2><div class="objectPuzzle"><div class="objectPuzzleImage ovenVisual"><img src="${AS.ovenPanel}" alt="1단계부터 3단계까지 돌릴 수 있는 다이얼 다섯 개가 달린 오븐">${dials}</div><div class="paper"><p>오븐의 다섯 다이얼은 각각 <b>1·2·3단계</b>로만 돌아간다.<br>다이얼을 누르면 다음 단계로 회전한다.</p><p><b>‘시그니처빵’에 사용된 단모음</b>의 혀 높이를 음절 순서대로 맞추자.</p><div class="ovenDialLegend"><span>고모음 = 3</span><span>중모음 = 2</span><span>저모음 = 1</span></div><div class="ovenCurrent">${state.ovenCode.join(' · ')}</div><button class="ok" onclick="checkOvenDials()">이대로 예열하기</button><div id="ovenMsg" class="answerMsg">${message}</div></div></div>`,true)}
function turnOvenDial(index){state.ovenCode[index]=state.ovenCode[index]%3+1;showOvenPuzzle()}
function checkOvenDials(){if(state.ovenCode.join('')==='33321'){state.ovenPreheated=true;showModal('<h2>오븐 예열 완료!</h2><div class="acquire"><span class="bigIcon">🔥</span>‘시그니처빵’의 단모음은<br><b>고 · 고 · 고 · 중 · 저</b>이므로 다이얼은 <b>33321</b>이다.<br><br>오븐이 따뜻하게 달아올랐다. 이제 조리대에서 재료를 순서대로 놓자.</div><button class="ok" onclick="closeModal()">조리대로 가기</button>');return}showOvenPuzzle('다이얼이 맞지 않는다. 단모음의 혀 높이를 다시 확인해 보자.');setTimeout(()=>{let msg=$('#ovenMsg');if(msg)msg.style.color='#a22f25'},0)}
const mixOrder=['goldenEgg','ryeFlour','honey','soyMilk','cinnamon'];
const mixLabels={ryeFlour:'🥣 호밀가루',goldenEgg:'🥚 황금계란',soyMilk:'🥛 두유',honey:'🍯 꿀',cinnamon:'🪵 시나몬'};
function inspectWorktop(){if(state.breadComplete){showDialogue('조리대에서 할아버지의 시그니처 빵을 완성했다.');return}if(!state.ryeFlour){inspectKitchenSpot('table','조리대 근처에 레시피북이 있는 것 같진 않아.');return}let missing=mixOrder.filter(id=>!state.items.includes(id));if(missing.length){showDialogue('아직 필요한 재료를 모두 모으지 못했다. 인벤토리를 다시 확인하자.');return}if(!state.ovenPreheated){showDialogue(`재료는 모두 모였다. 하지만 빵을 만들기 전에 <span class="clue">‘오븐’</span>부터 예열해야 한다.`);return}showMixingStation()}
function showMixingStation(){let slots=mixOrder.map((id,i)=>`<div class="mixSlot${i<state.mixStep?' filled':''}">${i<state.mixStep?mixLabels[id]:(i+1)+'번째 재료'}</div>`).join('');const choiceOrder=['honey','cinnamon','goldenEgg','soyMilk','ryeFlour'];let buttons=choiceOrder.map(id=>`<button onclick="placeMixIngredient('${id}')" ${state.mixStep>mixOrder.indexOf(id)?'disabled':''}>${mixLabels[id]}</button>`).join('');let hintButton=state.phoneOrderNoteViewed?`<button class="ok" style="background:#6b4b34" onclick="showPhoneOrderNote(true)">📱 휴대폰 세 번째 메모 확인</button>`:'';showModal(`<h2>시그니처 빵 만들기</h2><div class="paper"><p style="text-align:center"><b>인벤토리의 재료를 조리대에 차례로 내려놓자.</b></p><div class="mixSlots">${slots}</div><div class="mixIngredients">${buttons}</div><div id="mixMsg" class="answerMsg"></div>${hintButton}</div>`,true)}
function placeMixIngredient(id){let expected=mixOrder[state.mixStep];if(id!==expected){state.mixStep=0;showMixingStation();let msg=$('#mixMsg');msg.style.color='#a22f25';msg.textContent='재료를 놓는 순서가 맞지 않아 처음부터 다시 놓아야 한다.';return}state.mixStep++;if(state.mixStep<mixOrder.length){showMixingStation();return}state.breadComplete=true;stopTimer();state.items=state.items.filter(id=>!mixOrder.includes(id));state.inventoryPage=0;renderInventory();showSignatureBreadSuccess()}
function showSignatureBreadSuccess(){showModal(`<div class="successHero"><img src="${AS.signatureBread}" alt="완성된 할아버지의 시그니처 빵"><div class="successTitle"><span style="display:block;font-size:.55em;letter-spacing:.12em;margin-bottom:5px">MISSION SUCCESS</span>할아버지의 빵 만들기 성공!</div></div><button class="ok" onclick="showEndingScene()">가게 문 열기</button>`,true);$('#modalClose').hidden=true}
function showEndingScene(){closeModal();state.scene='ending';setScene(AS.endingCrowd,false);$('#inventory').innerHTML='';$('#hintLog').style.display='none';$('#backBtn').hidden=true;showDialoguePages(['드디어 가게 문을 열었다. 시그니처 빵을 기다리던 손님들로 가게가 금세 북적이기 시작했다.','손님들이 할아버지의 빵을 맛있게 먹는 모습을 보니 마음이 놓인다.','할아버지의 가게를 지킬 수 있어 뿌듯하다.'])}
function inspectEggTray(){if(state.goldenEgg){showDialogue('황금계란을 꺼낸 계란판이다.');return}if(!state.signatureNote){inspectKitchenSpot('eggs','계란판에 평범한 달걀들이 놓여 있다.');return}showGoldenEggQuiz1()}
function eggTrayHtml(active=false){return `<div><div class="eggCoord">5 × 6 계란판</div><div class="eggTray">${Array.from({length:30},(_,i)=>`<button class="eggCell" ${active?`onclick="chooseEgg(${i+1})"`:'disabled'} aria-label="세로 ${Math.floor(i/5)+1}번 가로 ${i%5+1}번 달걀">🥚</button>`).join('')}</div><div id="eggPickMsg" class="answerMsg"></div></div>`}
function showGoldenEggQuiz1(){showModal(`<h2>황금계란을 찾아라!</h2><div class="eggPuzzleLayout">${eggTrayHtml(false)}<div class="eggQuizSide"><h3>가로판 힌트</h3><div class="paper"><p>각 조건에 해당하는 음운을 차례로 조합하여 <b>단어</b>를 쓰시오.</p><div class="eggQuizCard"><b>여린입천장소리 + 예사소리</b><br><b>전설 + 평순 + 저모음</b><br><b>입술소리 + 비음</b><br><b>전설 + 평순 + 고모음</b><div class="answerRow"><input id="eggWord1" type="text" inputmode="text" placeholder="단어 입력" autocomplete="off"><button onclick="checkGoldenEggQuiz1()">정답 확인</button></div><div id="eggQuizMsg" class="answerMsg"></div></div></div></div></div>`,true);setTimeout(()=>$('#eggWord1')?.focus(),0)}
function checkGoldenEggQuiz1(){let answer=$('#eggWord1').value.replace(/\s/g,'');if(answer==='개미'){showModal(`<h2>가로판 힌트 획득</h2><div class="eggPuzzleLayout">${eggTrayHtml(false)}<div class="acquire"><span class="bigIcon">↔️</span>정답은 <b>개미</b>다.<br>가로판의 번호는 <span class="clue" style="font-size:32px">4</span>다.<button class="ok" onclick="showGoldenEggQuiz2()">다음 문제</button></div></div>`,true)}else{let msg=$('#eggQuizMsg');msg.style.color='#a22f25';msg.textContent='조건에 맞는 자음과 모음을 차례대로 다시 조합해 보자.'}}
function showGoldenEggQuiz2(){showModal(`<h2>황금계란을 찾아라!</h2><div class="eggPuzzleLayout">${eggTrayHtml(false)}<div class="eggQuizSide"><h3>세로판 힌트</h3><div class="paper"><p>각 조건에 해당하는 음운을 차례로 조합하여 <b>단어</b>를 쓰시오.</p><div class="eggQuizCard"><b>입술소리 + 된소리</b><br><b>후설 + 평순 + 저모음</b><br><b>여린입천장소리 + 비음</b><div class="answerRow"><input id="eggWord2" type="text" inputmode="text" placeholder="단어 입력" autocomplete="off"><button onclick="checkGoldenEggQuiz2()">정답 확인</button></div><div id="eggQuizMsg" class="answerMsg"></div></div></div></div></div>`,true);setTimeout(()=>$('#eggWord2')?.focus(),0)}
function checkGoldenEggQuiz2(){let answer=$('#eggWord2').value.replace(/\s/g,'');if(answer==='빵'){showEggTrayPuzzle()}else{let msg=$('#eggQuizMsg');msg.style.color='#a22f25';msg.textContent='조건에 맞는 자음과 모음을 차례대로 다시 조합해 보자.'}}
function showEggTrayPuzzle(){showModal(`<h2>황금계란을 찾아라!</h2><div class="eggPuzzleLayout">${eggTrayHtml(true)}<div class="acquire"><span class="bigIcon">↕️</span>두 번째 정답은 <b>빵</b>이다.<br>세로판의 번호는 <span class="clue" style="font-size:32px">5</span>다.<p>가로 4번·세로 5번에 있는 달걀을 누르자.</p></div></div>`,true)}
function chooseEgg(index){if(index!==24){$('#eggPickMsg').style.color='#a22f25';$('#eggPickMsg').textContent='평범한 달걀이다. 가로판과 세로판 번호를 다시 확인해 보자.';return}state.goldenEgg=true;if(!state.signatureIngredients.includes('goldenEgg'))state.signatureIngredients.push('goldenEgg');addItem('goldenEgg');showModal('<h2>황금계란 획득!</h2><div class="acquire"><span class="bigIcon" style="filter:sepia(1) saturate(5)">🥚</span>가로 4번, 세로 5번 자리에서 황금빛 계란을 찾았다!<br>황금계란이 인벤토리에 담겼다.<br><br>계란을 꺼내자 계란판 안쪽에서 접힌 쪽지가 보인다.</div><button class="ok" onclick="showFridgeNote()">쪽지 펼치기</button>')}
function addItem(id){if(!state.items.includes(id))state.items.push(id);state.inventoryPage=Math.floor((state.items.length-1)/4);renderInventory()}
function moveInventory(direction){let max=Math.max(0,Math.ceil(state.items.length/4)-1);state.inventoryPage=Math.max(0,Math.min(max,state.inventoryPage+direction));renderInventory()}
function renderInventory(){let box=$('#inventory');box.innerHTML='';let max=Math.max(0,Math.ceil(state.items.length/4)-1),start=state.inventoryPage*4;let left=document.createElement('button');left.className='invItem arrow';left.textContent='◀';left.title='이전 인벤토리';left.disabled=state.inventoryPage===0;left.onclick=()=>moveInventory(-1);box.appendChild(left);for(let i=0;i<4;i++){let b=document.createElement('button'),id=state.items[start+i];b.className='invItem';if(id){let info=itemInfo[id];b.textContent=info.icon;b.title=info.name;b.setAttribute('aria-label',info.name+' 열기');b.onclick=()=>info.open();if(id==='key')makeKeyDraggable(b)}else{b.disabled=true;b.setAttribute('aria-label','빈 인벤토리 칸')}box.appendChild(b)}let right=document.createElement('button');right.className='invItem arrow';right.textContent='▶';right.title='다음 인벤토리';right.disabled=state.inventoryPage>=max;right.onclick=()=>moveInventory(1);box.appendChild(right)}
function makeKeyDraggable(button){button.draggable=true;button.ondragstart=e=>{e.dataTransfer.setData('text/plain','key');e.dataTransfer.effectAllowed='move'};let startX=0,startY=0,dragging=false,ghost=null,target=null;button.onpointerdown=e=>{if(e.pointerType==='mouse')return;startX=e.clientX;startY=e.clientY;dragging=false;button.setPointerCapture(e.pointerId)};button.onpointermove=e=>{if(e.pointerType==='mouse')return;if(!dragging&&Math.hypot(e.clientX-startX,e.clientY-startY)>8){dragging=true;ghost=document.createElement('div');ghost.className='dragGhost';ghost.textContent='🗝️';document.body.appendChild(ghost);target=document.querySelector('.spot[aria-label="주방 문"]');target?.classList.add('keyTarget')}if(dragging){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}};button.onpointerup=e=>{if(e.pointerType==='mouse')return;if(dragging){let r=target?.getBoundingClientRect(),inside=r&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;ghost?.remove();target?.classList.remove('keyTarget');if(inside)unlockDoorWithKey();button.onclick=()=>{};setTimeout(()=>{if(document.body.contains(button))button.onclick=itemInfo.key.open},0)}}}
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{if(e.dataTransfer?.getData('text/plain')!=='key')return;e.preventDefault();let door=document.querySelector('.spot[aria-label="주방 문"]'),r=door?.getBoundingClientRect();if(r&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)unlockDoorWithKey()});
function openPhone(){if(!state.memoRead){showDialogue('잠금 패턴을 모르겠다. 가게 벽에 붙은 메모를 살펴보자.');return}if(state.phoneUnlocked){showPhoneHome();return}showModal(`<div class="phoneChallenge"><div class="memoZoomWrap"><div id="wallMemoPreview" class="wallMemoPreview" role="img" aria-label="벽에 붙은 오늘도 맛있는 하루 메모 확대 이미지"></div>벽에 붙어 있던 메모</div><div class="phone"><div class="phoneTop"><b>오후 5:17</b><span>🔒</span></div><h3>패턴을 입력하세요</h3><div class="patternHint">메모의 단모음 중 중복을 제외하고, 처음 나온 순서대로 터치하세요.</div><div id="patternBoard" class="patternBoard"><svg class="patternSvg" viewBox="0 0 310 245"><polyline id="patternLine" points=""></polyline></svg><div class="dots">${Array.from({length:12},(_,i)=>`<span class="pDot" data-i="${i+1}"></span>`).join('')}</div></div><button class="ok" style="margin-top:4px" onclick="clearPattern()">다시 입력</button><div id="patternMsg" class="patternMsg"></div></div></div>`,true);$('#wallMemoPreview').style.backgroundImage=`url("${AS.close}")`;setupPattern()}
const answer=[8,3,11,1,4];let drawn=[];
function setupPattern(){drawn=[];document.querySelectorAll('.pDot').forEach(dot=>{dot.style.cursor='pointer';dot.onclick=e=>{e.preventDefault();if(drawn.length>=answer.length)return;drawn.push(+dot.dataset.i);dot.classList.add('sel');updateLine();if(drawn.length===answer.length)checkPattern()}})}
function dotCenter(dot){let b=$('#patternBoard').getBoundingClientRect(),r=dot.getBoundingClientRect();return{x:r.left+r.width/2-b.left,y:r.top+r.height/2-b.top,cx:r.left+r.width/2,cy:r.top+r.height/2}}
function updateLine(){let pts=drawn.map(i=>dotCenter(document.querySelector(`.pDot[data-i="${i}"]`))).map(p=>`${p.x},${p.y}`).join(' ');$('#patternLine').setAttribute('points',pts)}
function clearPattern(){drawn=[];document.querySelectorAll('.pDot').forEach(d=>d.classList.remove('sel'));if($('#patternLine'))$('#patternLine').setAttribute('points','');if($('#patternMsg'))$('#patternMsg').textContent=''}
function checkPattern(){let ok=drawn.length===answer.length&&drawn.every((v,i)=>v===answer[i]);if(ok){state.phoneUnlocked=true;state.phone=true;addItem('phone');$('#patternMsg').style.color='#24723d';$('#patternMsg').textContent='잠금이 풀렸습니다. 휴대폰은 인벤토리에서 언제든 다시 열 수 있습니다.';setTimeout(showPhoneHome,800)}else{$('#patternMsg').style.color='#a22f25';$('#patternMsg').textContent='패턴이 다릅니다. 메모의 단모음 위치를 다시 확인하세요.';setTimeout(clearPattern,1100)}}
function showPhoneHome(){showModal(`<div class="phone phoneScreen"><div class="phoneTop"><b>오후 5:17</b><span>🔓</span></div><h3>할아버지의 휴대폰</h3><div class="phoneHome"><button class="app" onclick="showPhonePhotos()">🖼️<br>사진</button><button class="app" onclick="showPhoneNotes()">📝<br>메모장</button><button class="app" onclick="showPhoneOrderNote()">📌<br>메모 3</button></div><p style="text-align:center;color:#666;line-height:1.55">확인한 사진과 메모는<br>상단의 힌트 기록에 저장된다.</p></div>`)}
function renderHintLog(){let box=$('#hintLog');if(!box)return;let hints=[];if(state.phonePhotoViewed)hints.push(`<button class="hintChip" title="휴대폰 속 사진 다시 보기" onclick="showPhonePhotos()">힌트 1 · 휴대폰 속 사진</button>`);if(state.phoneNoteViewed)hints.push(`<button class="hintChip" title="휴대폰 속 메모장 내용 다시 보기" onclick="showPhoneNotes()">힌트 2 · 휴대폰 속 메모장 내용</button>`);if(state.signatureNote)hints.push(`<button class="hintChip" title="시그니처 재료 메모 다시 보기" onclick="showSignatureNote(true)">힌트 3 · 시그니처 재료 메모</button>`);if(state.fridgeNote)hints.push(`<button class="hintChip" title="계란판 쪽지 다시 보기" onclick="showFridgeNote(true)">힌트 4 · 계란판 안쪽 쪽지</button>`);if(state.ryeNote)hints.push(`<button class="hintChip" title="호밀가루 쪽지 다시 보기" onclick="showRyeNote(true)">힌트 5 · 냉장고 안쪽 쪽지</button>`);if(state.phoneOrderNoteViewed)hints.push(`<button class="hintChip" title="재료 순서 메모 다시 보기" onclick="showPhoneOrderNote(true)">힌트 6 · 휴대폰 세 번째 메모</button>`);box.innerHTML=`<button class="hintToggle" type="button" onclick="toggleHintPanel(event)" aria-expanded="false">💡 힌트${hints.length?`<span class="hintCount">${hints.length}</span>`:''}</button><div id="hintPanel" class="hintPanel" hidden><div class="hintPanelTitle">힌트 기록</div>${hints.length?`<div class="hintLogItems">${hints.join('')}</div>`:'<span class="hintLogEmpty">아직 기록된 힌트가 없습니다.</span>'}</div>`}
function toggleHintPanel(event){event?.stopPropagation();let panel=$('#hintPanel'),button=document.querySelector('.hintToggle');if(!panel)return;let opening=panel.hidden;panel.hidden=!opening;button?.setAttribute('aria-expanded',String(opening))}
document.addEventListener('click',event=>{let box=$('#hintLog'),panel=$('#hintPanel'),button=document.querySelector('.hintToggle');if(panel&&!panel.hidden&&box&&!box.contains(event.target)){panel.hidden=true;button?.setAttribute('aria-expanded','false')}})
function archivePhoneIfComplete(){if(!state.phonePhotoViewed||!state.phoneNoteViewed||!state.phoneOrderNoteViewed||!state.items.includes('phone'))return;state.items=state.items.filter(id=>id!=='phone');state.inventoryPage=Math.max(0,Math.min(state.inventoryPage,Math.max(0,Math.ceil(state.items.length/4)-1)));renderInventory()}
function showPhonePhotos(){state.phonePhotoViewed=true;renderHintLog();archivePhoneIfComplete();showModal(`<div class="phone phoneScreen"><div class="phoneTop"><b>오후 5:17</b><span>사진</span></div><h3>최근 사진</h3><img class="phonePhoto" src="${AS.phonePhoto}" alt="할아버지가 주방의 밀가루통 아래를 가리키는 사진"><p style="text-align:center;line-height:1.55">할아버지가 주방 한쪽의 <span class="clue">밀가루통 아래</span>를 가리키고 있다.<br>그곳에 무언가 숨겨져 있는 걸까?</p><button class="phoneBack" onclick="showPhoneHome()">‹ 휴대폰 홈</button></div>`)}
function showPhoneNotes(){state.phoneNoteViewed=true;renderHintLog();archivePhoneIfComplete();showModal(`<div class="phone phoneScreen"><div class="phoneTop"><b>오후 5:17</b><span>메모장</span></div><h3>할아버지의 메모</h3><div class="noteCard">요즘 크로운제과에서 내 시그니처 빵에 관심이 많은 듯하다.<br><br>시그니처 빵의 재료는 레시피북에 기록해놓지 말자.<br>만드는 방법도 숨겨놔야겠다.</div><button class="phoneBack" onclick="showPhoneHome()">‹ 휴대폰 홈</button></div>`)}
function showPhoneOrderNote(fromHint=false){state.phoneOrderNoteViewed=true;renderHintLog();archivePhoneIfComplete();showModal(`<div class="phone phoneScreen"><div class="phoneTop"><b>오후 5:17</b><span>메모 3</span></div><h3>재료를 넣는 순서</h3><div class="noteCard" style="text-align:left;line-height:1.75"><b>1.</b> 목청소리가 가장 앞에 오는데, 그중 이중모음이 더 앞에 온다.<br><br><b>2.</b> 소리의 세기가 강한 소리가 앞서야겠지.<br><br><b>3.</b> 마찰로 소리 나는 것이 가장 마지막에 오는 거야.</div><button class="phoneBack" onclick="${fromHint?'showMixingStation()':'showPhoneHome()'}">‹ ${fromHint?'재료 배치로 돌아가기':'휴대폰 홈'}</button></div>`)}
function toggleHints(){$('#stage').classList.toggle('showHints')}
function showMenu(){showModal('<h2>메뉴</h2><button class="ok" onclick="location.reload()">처음부터 다시 시작</button>')}
</script>
</body>
</html>
